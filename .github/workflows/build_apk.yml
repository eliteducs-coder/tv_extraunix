name: Build Smart TV APK
on:
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install buildozer
        run: pip install buildozer "cython<3"
        
      - name: Install dependencies
        # تمت إضافة automake و libltdl-dev لحل خطأ LT_SYS_SYMBOL_USCORE في أوبونتو 24
        run: sudo apt update && sudo apt-get install -y openjdk-17-jdk autoconf automake libtool libtool-bin m4 pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev zip unzip ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        
      - name: Initialize and Configure buildozer
        run: |
          yes | buildozer init
          sed -i 's/orientation = portrait/orientation = landscape/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,ffpyplayer/' buildozer.spec
          sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET/' buildozer.spec
          
      - name: Build APK
        run: yes | buildozer -v android debug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTV-APK
          path: bin/*.apk
